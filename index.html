function rr(x,y,w,h,r){X.beginPath();X.roundRect(x,y,w,h,r);X.fill();X.stroke()}

function update(){let y=ground;blocks.forEach(b=>y=Math.min(y,b.y-b.h/2));let h=Math.max(0,(ground-y)/48);record=Math.max(record,h);height.textContent=h.toFixed(1)+'m';timer.textContent='0'+Math.floor(time/60)+':'+String(Math.max(0,time|0)%60).padStart(2,'0');kills.textContent=killsN;let a=Object.entries(scores).sort((a,b)=>b[1].p-a[1].p).slice(0,4);leader.innerHTML=a.map((v,i)=>`${['🥇','🥈','🥉','4.'][i]} ${v[0]} <b>${v[1].p}</b> 💥${v[1].k}`).join('<br>')}
function finish(){running=false;M.pause();blocks.forEach(b=>sc(b.user).s++);let a=Object.entries(scores).sort((a,b)=>(b[1].p+b[1].k*20+b[1].s*8)-(a[1].p+a[1].k*20+a[1].s*8));let w=a[0]||['—',{p:0,k:0,s:0}];winner.textContent=w[0];stats.textContent=`${w[1].k} знищень • ${w[1].s} блоків вижило • ${w[1].p} очок • рекорд ${record.toFixed(1)} м`;result.style.display='flex';sfx(440,.35,'sine',.08)}
function reset(){blocks=[];parts=[];rings=[];sparks=[];entrances=[];scores={};time=90;killsN=0;combo={u:'',n:0,t:0};result.style.display='none';running=true;auto=.4;if(sound){M.currentTime=0;M.volume=.28;M.play().catch(()=>{})}msg('⚔️ NEW BATTLE')}
function loop(n){let dt=Math.min(.025,(n-last)/1000);last=n;if(running){time-=dt;auto-=dt;if(auto<=0){let r=Math.random(),i=r<.43?Math.random()*2|0:r<.67?2+Math.random()*3|0:r<.89?5+Math.random()*3|0:8+Math.random()*4|0;drop(gifts[i]);auto=.62+Math.random()*1.1}if(time<=0)finish();sim(dt)}draw();update();requestAnimationFrame(loop)}
gifts.forEach(d=>{let b=document.createElement('button');b.className='gift';b.innerHTML=`${d.e} ${d.n}<small>LV.${d.tier} • HP ${d.hp} • DMG ${d.pow}</small>`;b.onclick=()=>{drop(d);document.querySelector('#giftPanel').classList.remove('show')};document.querySelector('#giftPanel').appendChild(b)});
const giftPanelEl=document.querySelector('#giftPanel');
const giftsBtn=document.querySelector('#gifts');
const randomBtn=document.querySelector('#random');
const resetBtn=document.querySelector('#reset');
const againBtn=document.querySelector('#again');
const soundBtn=document.querySelector('#sound');
const startBtn=document.querySelector('#start');
giftsBtn.addEventListener('click',()=>giftPanelEl.classList.toggle('show'));
randomBtn.addEventListener('click',()=>drop(gifts[Math.random()*gifts.length|0]));
resetBtn.addEventListener('click',reset);
againBtn.addEventListener('click',reset);
soundBtn.addEventListener('click',()=>{sound=!sound;soundBtn.textContent=sound?'🔊':'🔇';M.muted=!sound;if(sound&&running)M.play().catch(()=>{})});
startBtn.addEventListener('click',()=>{ac=new (window.AudioContext||window.webkitAudioContext)();ac.resume();startBtn.style.display='none';reset()});
requestAnimationFrame(loop);
</script></body></html>
